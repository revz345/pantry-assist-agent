{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">{% if item %}Edit Item{% else %}Add Item{% endif %}</h1>
        <p class="page-subtitle">{% if item %}Update this item's details{% else %}Add something new to your pantry{% endif %}</p>
    </div>
</div>

<div class="card" style="max-width: 640px;">
    <form method="post" action="{{ '/items/' ~ item.id ~ '/edit' if item else '/items/new' }}">
        <div class="grid">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" value="{{ item.name if item else '' }}" required autofocus>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity *</label>
                <input type="number" step="0.01" id="quantity" name="quantity" value="{{ item.quantity if item else 1 }}" required min="0">
            </div>
        </div>
        <div class="grid">
            <div class="form-group">
                <label for="unit">Unit</label>
                <select name="unit" id="unit">
                    <option value="pcs" {% if item and item.unit == 'pcs' %}selected{% endif %}>Pieces</option>
                    <option value="g" {% if item and item.unit == 'g' %}selected{% endif %}>Grams (g)</option>
                    <option value="kg" {% if item and item.unit == 'kg' %}selected{% endif %}>Ounces (oz)</option>
                    <option value="l" {% if item and item.unit == 'l' %}selected{% endif %}>Quarts (qt)</option>
                    <option value="ml" {% if item and item.unit == 'ml' %}selected{% endif %}>Fluid oz (fl oz)</option>
                    <option value="cup" {% if item and item.unit == 'cup' %}selected{% endif %}>Cups</option>
                    <option value="tbsp" {% if item and item.unit == 'tbsp' %}selected{% endif %}>Tablespoons</option>
                    <option value="tsp" {% if item and item.unit == 'tsp' %}selected{% endif %}>Teaspoons</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location_id">Location</label>
                <select name="location_id" id="location_id">
                    <option value="">-- Select --</option>
                    {% for loc in locations %}
                    <option value="{{ loc.id }}" {% if item and item.location_id == loc.id %}selected{% endif %}>{{ loc.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select name="category" id="category">
                    <option value="">-- Select --</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if item and item.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="grid">
            <div class="form-group">
                <label for="expiry_date">Expiry Date</label>
                <input type="date" id="expiry_date" name="expiry_date" value="{{ item.expiry_date if item and item.expiry_date else '' }}">
            </div>
            <div class="form-group">
                <label for="barcode">Barcode</label>
                <input type="text" id="barcode" name="barcode" value="{{ item.barcode if item else '' }}" placeholder="Optional">
            </div>
        </div>
        <div class="flex" style="margin-top: var(--space-5);">
            <button type="submit" class="btn">{% if item %}Update{% else %}Create{% endif %} Item</button>
            <a href="/items" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
