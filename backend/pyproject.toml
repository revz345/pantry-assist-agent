[project]
name = "pantry-backend"
version = "0.1.0"
description = "Pantry Assist API - FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "openai>=1.30",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "playwright>=1.44",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "COM", "DTZ", "EXE", "FA", "ISC", "ICN", "LOG", "N", "PD", "PIE", "PT", "Q", "RET", "RSE", "SIM", "T10", "T20", "TCH", "INT", "PTH", "ERA", "PL", "TRY"]
ignore = ["ANN101", "ANN102", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "S101"]
fixable = ["ALL"]
unfixable = ["ANN", "ARG", "COM", "FA", "ISC", "INP", "N", "PIE", "PT", "RET", "RSE", "SIM", "T10", "T20", "TCH", "INT", "PTH", "ERA", "PL", "TRY"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true